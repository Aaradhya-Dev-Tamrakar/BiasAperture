[project.optional-dependencies]
fairness = [
    "fairlearn>=0.10.0",
    "aif360>=0.6.0",
    "scikit-learn>=1.3.0",
]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.4.0",
    "fairlearn>=0.10.0",
    "aif360>=0.6.0",
    "scikit-learn>=1.3.0",
    "jinja2>=3.1.0",
]

[project.scripts]
bias-aperture = "bias_aperture.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["src/tests"]
pythonpath = ["src"]
addopts = "-ra -q"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["bias_aperture"]

